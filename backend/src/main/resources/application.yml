server:
  port: 8080

spring:
  application:
    name: date-backend
  # 首次运行：copy application-local.example.yml application-local.yml 并填密码
  profiles:
    include: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/date_app?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  # 免登录单用户模式：所有记录都挂在这个用户下
  user-id: 1
